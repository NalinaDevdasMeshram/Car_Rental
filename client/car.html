<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Available Cars</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <div class="container py-4">
      <h2 class="mb-4 text-center">Available Cars to Rent</h2>
      <div id="carsContainer" class="row g-4"></div>
    </div>

    <script>
      const API_BASE = "http://localhost:8080/api";

      const loggedInUser = JSON.parse(localStorage.getItem("user"));
      // Example: { token: "...", role: "CUSTOMER" } or { role: "AGENCY" }

      async function loadCars() {
        const response = await fetch(`${API_BASE}/cars`);
        const cars = await response.json();

        const container = document.getElementById("carsContainer");
        container.innerHTML = "";

        cars.forEach((car) => {
          const isCustomer = loggedInUser && loggedInUser.role === "CUSTOMER";

          const card = document.createElement("div");
          card.className = "col-md-6 col-lg-4";

          card.innerHTML = `
      <div class="card shadow-sm h-100">
        <div class="card-body">
          <h5 class="card-title">${car.vehicleModel}</h5>
          <p><strong>Vehicle No:</strong> ${car.vehicleNumber}</p>
          <p><strong>Seating:</strong> ${car.seatingCapacity}</p>
          <p><strong>Rent/Day:</strong> ₹${car.rentPerDay}</p>

          ${
            isCustomer
              ? `
            <div class="mb-2">
              <label class="form-label">Number of Days</label>
              <select class="form-select days-select" id="days-${car.id}">
                ${[...Array(30)].map((_, i) => `<option value="${i + 1}">${i + 1}</option>`).join("")}
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">Start Date</label>
              <input type="date" class="form-control" id="date-${car.id}">
            </div>
          `
              : ""
          }

          <button class="btn btn-primary w-100" onclick="rentCar(${car.id})">Rent Car</button>
        </div>
      </div>
    `;

          container.appendChild(card);
        });
      }

      async function rentCar(carId) {
        if (!loggedInUser) {
          alert("Please login as customer to book a car");
          window.location.href = "login.html";
          return;
        }

        if (loggedInUser.role === "AGENCY") {
          alert("Agencies are not allowed to book cars");
          return;
        }

        const numberOfDays = document.getElementById(`days-${carId}`).value;
        const startDate = document.getElementById(`date-${carId}`).value;

        if (!startDate) {
          alert("Please select a start date");
          return;
        }

        const response = await fetch(`${API_BASE}/bookings`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${loggedInUser.token}`,
          },
          body: JSON.stringify({
            carId,
            startDate,
            numberOfDays: parseInt(numberOfDays),
          }),
        });

        const data = await response.json();

        if (response.ok) {
          alert("Car booked successfully!");
          loadCars();
        } else {
          alert(data.message || "Booking failed");
        }
      }

      loadCars();
    </script>
  </body>
</html>
