<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Add New Car</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <div class="container py-5">
      <div class="card shadow mx-auto" style="max-width: 600px">
        <div class="card-body">
          <h3 class="mb-4 text-center">Add New Car</h3>

          <form id="addCarForm">
            <div class="mb-3">
              <label class="form-label">Vehicle Model</label>
              <input
                type="text"
                class="form-control"
                id="vehicleModel"
                required
              />
            </div>

            <div class="mb-3">
              <label class="form-label">Vehicle Number</label>
              <input
                type="text"
                class="form-control"
                id="vehicleNumber"
                required
              />
            </div>

            <div class="mb-3">
              <label class="form-label">Seating Capacity</label>
              <input
                type="number"
                class="form-control"
                id="seatingCapacity"
                required
              />
            </div>

            <div class="mb-3">
              <label class="form-label">Rent Per Day</label>
              <input
                type="number"
                step="0.01"
                class="form-control"
                id="rentPerDay"
                required
              />
            </div>

            <button type="submit" class="btn btn-success w-100">Add Car</button>
          </form>
        </div>
      </div>
    </div>

    <script>
      const API_BASE = "http://localhost:8080/api";
      const loggedInUser = JSON.parse(localStorage.getItem("user"));

      if (!loggedInUser || loggedInUser.role !== "AGENCY") {
        alert("Only agencies can access this page");
        window.location.href = "login.html";
      }

      document
        .getElementById("addCarForm")
        .addEventListener("submit", async function (e) {
          e.preventDefault();

          const payload = {
            vehicleModel: document.getElementById("vehicleModel").value,
            vehicleNumber: document.getElementById("vehicleNumber").value,
            seatingCapacity: parseInt(
              document.getElementById("seatingCapacity").value,
            ),
            rentPerDay: parseFloat(document.getElementById("rentPerDay").value),
          };

          const response = await fetch(`${API_BASE}/cars`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${loggedInUser.token}`,
            },
            body: JSON.stringify(payload),
          });

          const data = await response.json();

          if (response.ok) {
            alert("Car added successfully");
            document.getElementById("addCarForm").reset();
          } else {
            alert(data.message || "Failed to add car");
          }
        });
    </script>
  </body>
</html>
