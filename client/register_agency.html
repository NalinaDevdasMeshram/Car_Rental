<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agency Registration</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="navbarContainer"></div>

    <div class="container py-5">
      <div class="card shadow page-card">
        <div class="card-body">
          <h3 class="text-center mb-4">Agency Registration</h3>

          <form id="agencyRegisterForm">
            <div class="mb-3">
              <label class="form-label">Owner Full Name</label>
              <input id="fullName" type="text" class="form-control" required />
            </div>

            <div class="mb-3">
              <label class="form-label">Email</label>
              <input id="email" type="email" class="form-control" required />
            </div>

            <div class="mb-3">
              <label class="form-label">Password</label>
              <input
                id="password"
                type="password"
                class="form-control"
                required
              />
            </div>

            <div class="mb-3">
              <label class="form-label">Agency Name</label>
              <input
                id="agencyName"
                type="text"
                class="form-control"
                required
              />
            </div>

            <div class="mb-3">
              <label class="form-label">Phone</label>
              <input id="phone" type="text" class="form-control" />
            </div>

            <div class="mb-3">
              <label class="form-label">Address</label>
              <textarea id="address" class="form-control"></textarea>
            </div>

            <div class="mb-3">
              <label class="form-label">License Number</label>
              <input id="licenseNumber" type="text" class="form-control" />
            </div>

            <button type="submit" class="btn btn-success w-100">
              Register as Agency
            </button>
          </form>
        </div>
      </div>
    </div>

    <script src="js/common.js"></script>
    <script src="js/auth.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
